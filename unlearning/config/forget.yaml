model_family: qwen2.5-coder-3b
model_path: null   

LoRA:
  enabled: null  # null: method default; true: LoRA; false: all parameters
  targets: all
  r: 8
  alpha: 32
  dropout: 0.05

lr: 1e-5
batch_size: 4
gradient_accumulation_steps: 4
num_epochs: 5
weight_decay: 0.01
max_length: 500
precision: auto
gradient_checkpointing: true

forget_loss: grad_diff   # grad_diff | IHL | simnpo_gdr | codeeraser | prod

# Local JSONL paths
forget_data_path: data/forget.jsonl
retain_data_path: data/retain.jsonl

# HuggingFace Hub 
data_path: null
split: null

# Hyperparameters
npo_coeff: 1.0
grad_diff_coeff: 1.0
KL_coeff: 1.0
ref_policy: fine_tuned
beta: 0.1
gamma: 0.0

# CodeEraser / SSCU coefficients from code-unlearning.
control_alpha: 1.0
control_lambda: 0.1
select_gamma: 0.1
retain_max_length: 128

prod:
  top_p: 0.8
  alpha: 0.0
  temperature: null
  max_N: null

importance_file: null
save_dir: ${model_path}/${forget_loss}_lora-${LoRA.enabled}_target-${LoRA.targets}_r-${LoRA.r}_${lr}_${num_epochs}
overwrite_dir: true
save_model: true
eval_while_train: false
eval_only: false
seed: 42

tracking:
  enabled: true
  output_dir: results/unlearning
  resource_interval_seconds: 2.0
  log_every_steps: 1
  sample_metrics: true
  sample_every_epoch: false
  sample_max_length: 512
  sample_seed: ${..seed}
  max_samples_per_split: null
  copy_datasets: false

eval:
  model_path: ${..model_path}
  model_family: ${..model_family}
  save_dir: ${..save_dir}
  data_path:                          
    - ${..forget_data_path}
    - ${..retain_data_path}
  split: null
  split_list:
    - forget_eval
    - retain_eval
  eval_task:
    - eval_log_forget
    - eval_log
  question_key:
    - question
    - question
  answer_key:
    - answer
    - answer
  base_answer_key:
    - answer
    - answer
  perturbed_answer_key:
    - answer
    - answer
  generation:
    max_length: 200
    max_new_tokens: null
  save_generated_text: true
  ds_size: 300
  overwrite: true
  use_pretrained: false
  batch_size: 16
  retain_result: null
  reinitialize_weights: false
