# Configuration for jailbreak evaluation script
model_family: qwen2.5-coder-3b
model_path: /kaggle/working/merged_model
data_path: /kaggle/input/datasets/mongnguynkin/1283-malicious/malicious_qa.jsonl
output_path: datasets/predictions.jsonl

max_new_tokens: 1024
temperature: 0.1
seed: 42
device_map: auto
torch_dtype: bfloat16 # float16 | bfloat16 | float32

# One complete model per GPU; independent input shards are merged in input order.
num_gpus: auto  # auto: all visible GPUs; 1: single GPU; 0: CPU
batch_size: 4  # Per GPU; reduce to 2 or 1 if prompts exhaust VRAM.
