model_family: qwen2.5-coder-3b
model_path: null   

LoRA:
  targets: all
  r: 8
  alpha: 32
  dropout: 0.05

lr: 1e-5
batch_size: 4
gradient_accumulation_steps: 4
num_epochs: 5
weight_decay: 0.01
max_length: 500

forget_loss: grad_diff   # grad_diff | IHL | simnpo_gdr

# Local JSONL paths
forget_data_path: data/forget.jsonl
retain_data_path: data/retain.jsonl

# HuggingFace Hub 
data_path: null
split: null

# Hyperparameters
npo_coeff: 1.0
grad_diff_coeff: 1.0
KL_coeff: 1.0
ref_policy: fine_tuned
beta: 0.1
gamma: 0.0

importance_file: null
save_dir: ${model_path}/${forget_loss}_target-${LoRA.targets}_r-${LoRA.r}_${lr}_${num_epochs}
overwrite_dir: true
save_model: true
eval_while_train: false
eval_only: false
seed: 42

eval:
  model_path: ${..model_path}
  model_family: ${..model_family}
  save_dir: ${..save_dir}
  data_path:                          
    - ${..forget_data_path}
    - ${..retain_data_path}
  split: null
  split_list:
    - forget_eval
    - retain_eval
  eval_task:
    - eval_log_forget
    - eval_log
  question_key:
    - question
    - question
  answer_key:
    - answer
    - answer
  base_answer_key:
    - answer
    - answer
  perturbed_answer_key:
    - answer
    - answer
  generation:
    max_length: 200
    max_new_tokens: null
  save_generated_text: true
  ds_size: 300
  overwrite: true
  use_pretrained: false
  batch_size: 16
  retain_result: null
  reinitialize_weights: false